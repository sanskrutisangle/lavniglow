<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LavniGlow - Skincare & Haircare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">LavniGlow</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center" id="user-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="wishlist.html">Wishlist (<span id="wishlist-count">0</span>)</a></li>
                    <li class="nav-item"><a class="nav-link" href="cart.html">Cart (<span id="cart-count">0</span>)</a></li>
                    <li class="nav-item"><a class="btn btn-outline-primary ms-2" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="btn btn-primary text-white ms-2" href="register.html">Register</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="hero-section">
        <div class="container">
            <h1 class="display-4 fw-bold">Reveal Your Natural Radiance</h1>
            <p class="lead text-muted">Discover our expert-formulated skincare and haircare essentials.</p>
        </div>
    </header>

    <!-- Products Grid -->
    <main class="container my-5">
        <h2 class="text-center mb-4">Our Collection</h2>
        <div class="row row-cols-1 row-cols-md-3 g-4" id="product-list">
            <!-- Dynamically populated by JS -->
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 LavniGlow. All Rights Reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    <script>
        // Render Products
        const productList = document.getElementById('product-list');
        products.forEach(p => {
            productList.innerHTML += `
                <div class="col">
                    <div class="card h-100">
                        <img src="${p.image}" class="card-img-top" alt="${p.name}">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">${p.name}</h5>
                            <p class="card-text text-muted small">${p.desc}</p>
                            <p class="card-text fw-bold text-success mt-auto">₹${p.price}</p>
                            <div class="d-flex gap-2 mt-3">
                                <button class="btn btn-primary flex-grow-1" onclick="addToCart(${p.id})">Add to Cart</button>
                                <button class="btn btn-outline-danger" onclick="addToWishlist(${p.id})">❤️</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });
    </script>
</body>

</html>
