<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed - LavniGlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container text-center mt-5 pt-5">
        <div class="card p-5 shadow-sm mx-auto" style="max-width: 600px;">
            <h1 class="text-success mb-3">Order Confirmed! 🎉</h1>
            <p class="lead">Thank you for shopping with <strong>LavniGlow</strong>.</p>
            <p>Your order ID is: <strong id="order-id"></strong></p>
            <p class="text-muted">A confirmation notification has been dispatched regarding your Cash on Delivery (COD) order. Our team will process it shortly!</p>
            <a href="index.html" class="btn btn-primary mt-3">Back to Home</a>
        </div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('order-id').innerText = urlParams.get('id');
    </script>
</body>

</html>
