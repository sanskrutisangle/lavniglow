<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist - LavniGlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container">
            <a class="navbar-brand" href="index.html">LavniGlow</a>
            <a href="index.html" class="btn btn-outline-secondary btn-sm">Continue Shopping</a>
        </div>
    </nav>

    <div class="container my-5">
        <h2>My Wishlist</h2>
        <div class="row row-cols-1 row-cols-md-3 g-4 mt-2" id="wishlist-container"></div>
    </div>

    <script src="script.js"></script>
    <script>
        const container = document.getElementById('wishlist-container');
        if (wishlist.length === 0) {
            container.innerHTML = '<p class="text-muted">Your wishlist is empty.</p>';
        } else {
            wishlist.forEach((p, index) => {
                container.innerHTML += `
                    <div class="col">
                        <div class="card h-100">
                            <img src="${p.image}" class="card-img-top" alt="${p.name}">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title">${p.name}</h5>
                                <p class="card-text fw-bold text-success">₹${p.price}</p>
                                <div class="d-flex gap-2 mt-auto">
                                    <button class="btn btn-primary flex-grow-1" onclick="addToCart(${p.id}); removeFromWishlist(${index})">Move to Cart</button>
                                    <button class="btn btn-outline-danger" onclick="removeFromWishlist(${index})">Remove</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function removeFromWishlist(index) {
            wishlist.splice(index, 1);
            localStorage.setItem('lavni_wishlist', JSON.stringify(wishlist));
            window.location.reload();
        }
    </script>
</body>

</html>
